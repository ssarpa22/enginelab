name: Validate

on:
  pull_request:
    branches: [main, "feat/**"]
  push:
    branches:
      - main
      - "feat/**"
      - "ci/**"

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm (fixes npm 10/11 Arborist peer-resolution bug)
        run: npm install --global npm@11.21.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run typecheck, tests and production build
        run: npm run validate
